name: cognijuegos_app

# ==============================================================================
# Servicio CogniJuegos (https://cognijuegos.asistodo.com.ar — Puerto 8087)
# Arquitectura de 2 contenedores: Caddy (SPA + Reverse Proxy) + Backend FastAPI.
# Se conecta a la base de datos centralizada mediante la red externa compartida.
# ==============================================================================

services:
  # 1. Servidor Web y Reverse Proxy (sirve ./dist en /srv/dist y redirige /api/*)
  caddy:
    image: caddy:2-alpine
    container_name: cognijuegos-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORT:-8087}:8087"                 # Único puerto expuesto hacia el exterior (8087)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro  # Reglas de proxy y ruteo (Solo lectura)
      - ./dist:/srv/dist:ro                  # Archivos estáticos del Frontend compilado (Solo lectura)
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    # SEGURIDAD: Caddy SOLO está en la red interna del servicio (sin acceso a la red de MongoDB)
    networks:
      - red-interna-servicio
    depends_on:
      backend:
        condition: service_healthy

  # 2. Backend FastAPI (Python)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognijuegos-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8087"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=8087
      - HOST=0.0.0.0
      - SERVICE_KEY=${SERVICE_KEY:-conmijuegos}
      - FRONTEND_URL=${FRONTEND_URL:-https://cognijuegos.asistodo.com.ar}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-https://autenticacion.asistodo.com.ar}
      - MONGO_URI=${MONGO_URI:-}
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb-central:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-conmijuegos_db}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    # Conectado a su red interna (para Caddy) y a la red externa compartida (para mongodb-central)
    networks:
      - red-interna-servicio
      - red-mongo-compartida

volumes:
  caddy_data:
  caddy_config:

networks:
  # Red interna propia de este servicio (Caddy <-> Backend)
  red-interna-servicio:
    name: red-interna-cognijuegos
    driver: bridge

  # Red externa compartida para conectarse a mongodb-central (separada del Autenticador)
  red-mongo-compartida:
    name: red-mongo-compartida
    external: true


